        // Web Audio API Sound Generator for Order Call Notification
        const playOrderCallSound = () => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const playTone = (freq, startTime, duration) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
                    
                    gain.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
                    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + startTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + startTime);
                    osc.stop(audioCtx.currentTime + startTime + duration);
                };

                playTone(587.33, 0, 0.35); // D5
                playTone(880, 0.22, 0.5);  // A5
            } catch (e) {
                console.warn("AudioContext not supported or blocked", e);
            }
        };

        const announceOrderCall = (customerName, orderId, soundEnabled = true, voiceType = 'female', template = '') => {
            // Stop any currently playing audio stream
            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                currentAudioPlayer.currentTime = 0;
                currentAudioPlayer = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            const textTemplate = template || "Pesanan atas nama {nama}, dengan nomor {id}, sudah selesai dan siap diambil.";
            const cleanName = (customerName || 'Pelanggan').replace(/[^a-zA-Z0-9\s]/g, '').trim();
            const cleanId = (orderId || '').replace(/[^a-zA-Z0-9-]/g, '').trim();

            const speechText = textTemplate
                .replace(/{nama}/gi, cleanName)
                .replace(/{id}/gi, cleanId);

            if (soundEnabled) {
                playOrderCallSound();
            }

            const delay = soundEnabled ? 650 : 50;

            // If Male voice is requested, use Web Speech API with explicitly low pitch for clear gender distinction
            if (voiceType === 'male' && 'speechSynthesis' in window) {
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(speechText);
                    utterance.lang = 'id-ID';
                    utterance.rate = 0.88;
                    utterance.pitch = 0.65; // Distinctly lower pitch for male voice
                    
                    const voices = window.speechSynthesis.getVoices();
                    const idVoices = voices.filter(v => v.lang.toLowerCase().includes('id'));
                    if (idVoices.length > 0) {
                        const maleVoice = idVoices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('andika')) || idVoices[0];
                        utterance.voice = maleVoice;
                    }
                    window.speechSynthesis.speak(utterance);
                }, delay);
                return;
            }

            // For Female voice, use Google Indonesian TTS stream for realistic female tone
            const encodedText = encodeURIComponent(speechText);
            const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=id&client=tw-ob`;

            const audio = new Audio(googleTtsUrl);
            currentAudioPlayer = audio;

            setTimeout(() => {
                audio.play().catch(err => {
                    console.warn("Google TTS audio play failed, falling back to Web Speech API:", err);
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(speechText);
                        utterance.lang = 'id-ID';
                        utterance.rate = 0.95;
                        utterance.pitch = 1.2; // Distinctly higher pitch for female fallback
                        window.speechSynthesis.speak(utterance);
                    }
                });
            }, delay);
        };

        function calculateCRC16(str) {
            let crc = 0xFFFF;
            for (let c = 0; c < str.length; c++) {
                crc ^= str.charCodeAt(c) << 8;
                for (let i = 0; i < 8; i++) {
                    if (crc & 0x8000) {
                        crc = (crc << 1) ^ 0x1021;
                    } else {
                        crc = crc << 1;
                    }
                }
            }
            let hex = (crc & 0xFFFF).toString(16).toUpperCase();
            while (hex.length < 4) hex = '0' + hex;
            return hex;
        }

        function generateDynamicQris(staticQrisString, amount) {
            if (!staticQrisString || typeof staticQrisString !== 'string') return '';
            let qris = staticQrisString.trim();
            if (qris.length < 10) return qris;

            if (qris.endsWith('6304') && qris.length >= 4) {
                qris = qris.slice(0, -4);
            } else {
                const idx63 = qris.lastIndexOf('6304');
                if (idx63 !== -1) {
                    qris = qris.slice(0, idx63);
                }
            }

            if (qris.includes('010211')) {
                qris = qris.replace('010211', '010212');
            } else if (!qris.includes('010212')) {
                qris = '000201010212' + qris.replace('000201', '');
            }

            let cleanQris = '';
            let i = 0;
            while (i < qris.length) {
                const tag = qris.slice(i, i + 2);
                const lenStr = qris.slice(i + 2, i + 4);
                const len = parseInt(lenStr, 10);
                if (isNaN(len)) {
                    cleanQris += qris.slice(i);
                    break;
                }
                const value = qris.slice(i + 4, i + 4 + len);
                if (tag !== '54') {
                    cleanQris += tag + lenStr + value;
                }
                i += 4 + len;
            }

            const amountStr = Math.round(amount).toString();
            const tag54Val = '54' + (amountStr.length < 10 ? '0' + amountStr.length : amountStr.length) + amountStr;

            const idx58 = cleanQris.indexOf('5802ID');
            const idx59 = cleanQris.indexOf('59');
            if (idx58 !== -1) {
                cleanQris = cleanQris.slice(0, idx58) + tag54Val + cleanQris.slice(idx58);
            } else if (idx59 !== -1) {
                cleanQris = cleanQris.slice(0, idx59) + tag54Val + cleanQris.slice(idx59);
            } else {
                cleanQris += tag54Val;
            }

            cleanQris += '6304';
            const crcVal = calculateCRC16(cleanQris);
            return cleanQris + crcVal;
        }

        const copyToClipboardText = async (text) => {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (err) {
                console.warn("Clipboard API failed, using fallback", err);
            }
            try {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                const successful = document.execCommand('copy');
                document.body.removeChild(textarea);
                return successful;
            } catch (err) {
                console.error("Fallback copy failed", err);
                return false;
            }
        };

            const getQrBase64Sync = (text, size = 150) => {
                return new Promise((resolve) => {

                    new QRCode(tempDiv, {
                        text: text,
                        width: size,
                        height: size,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                    setTimeout(() => {
                        const canvas = tempDiv.querySelector('canvas');
                        resolve(canvas ? canvas.toDataURL('image/png') : '');
                    }, 50);
                });

            const downloadQRImage = async (table) => {
                const qrBase64 = await getQrBase64Sync(table.link, 250);
                
                const canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 450;
                const ctx = canvas.getContext('2d');
                
                // Background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Border styling
                ctx.strokeStyle = '#e4e4e7';
                ctx.lineWidth = 2;
                ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
                
                // Resto Name
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(settings.restoName, canvas.width / 2, 60);
                
                // Table Badge Background (Rounded Rectangle Manual)
                const badgeWidth = 140;
                const x = (canvas.width - badgeWidth) / 2;
                const y = 80;
                const w = badgeWidth;
                const h = 36;
                const r = 18;
                
                ctx.fillStyle = '#ef4444'; // Red Brand
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.fill();
                
                // Table Name Text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText(table.name, canvas.width / 2, 104);
                
                // Subtitle
                ctx.fillStyle = '#52525b'; 
                ctx.font = '14px sans-serif';
                ctx.fillText('Scan untuk melihat menu & memesan', canvas.width / 2, 145);
                
                // Draw QR Code and download
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, (canvas.width - 250) / 2, 165, 250, 250);
                    
                    const dataUrl = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = dataUrl;

                                            <label className="text-xs font-bold text-zinc-600 block mb-1">Kategori</label>
                                            <select value={menuForm.category} onChange={(e) => setMenuForm({...menuForm, category: e.target.value})} className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-bold bg-white">
                                                {categories.filter(c => c.id !== 'Semua').map(c => (
                                                    <option key={c.id} value={c.id}>{c.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-zinc-600 block mb-1">URL Gambar</label>
                                        <input type="text" value={menuForm.image} onChange={(e) => setMenuForm({...menuForm, image: e.target.value})} placeholder="https://..." className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-zinc-600 block mb-1">Deskripsi</label>
                                        <textarea rows="2" value={menuForm.description} onChange={(e) => setMenuForm({...menuForm, description: e.target.value})} className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs"></textarea>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 bg-brand-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md hover:bg-brand-700">Simpan</button>
                                        <button type="button" onClick={() => setShowMenuModal(false)} className="flex-1 bg-zinc-200 text-zinc-800 font-bold py-2.5 rounded-xl text-xs hover:bg-zinc-300">Batal</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showStaffModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 glass-panel">
                            <div className="bg-white w-full max-w-xs sm:max-w-sm rounded-2xl p-5 shadow-2xl">
                                <h3 className="text-base font-black text-zinc-800 mb-4">{editingStaff ? 'Edit Staff' : 'Tambah Staff Baru'}</h3>
                                <form onSubmit={saveStaff} className="space-y-3.5">
                                    <div>
                                        <label className="text-xs font-bold text-zinc-600 block mb-1">Nama Lengkap</label>
                                        <input type="text" required value={staffForm.name} onChange={(e) => setStaffForm({...staffForm, name: e.target.value})} className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-bold" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-zinc-600 block mb-1">Username</label>
                                        <input type="text" required value={staffForm.username} onChange={(e) => setStaffForm({...staffForm, username: e.target.value})} className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-bold" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-zinc-600 block mb-1">PIN (6 digit)</label>
                                        <input type="password" maxLength="6" required value={staffForm.pin} onChange={(e) => setStaffForm({...staffForm, pin: e.target.value})} placeholder="••••••" className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-bold tracking-widest text-center" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-zinc-600 block mb-1">Role</label>
                                        <select value={staffForm.role} onChange={(e) => setStaffForm({...staffForm, role: e.target.value})} className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-bold bg-white">
                                            <option value="cashier">Kasir</option>
                                            <option value="admin">Administrator</option>
                                        </select>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 bg-brand-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md hover:bg-brand-700">Simpan</button>
                                        <button type="button" onClick={() => setShowStaffModal(false)} className="flex-1 bg-zinc-200 text-zinc-800 font-bold py-2.5 rounded-xl text-xs hover:bg-zinc-300">Batal</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showPaymentModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 glass-panel">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                                <h3 className="text-base font-black text-zinc-800 mb-4">{editingPayment ? 'Edit Metode Pembayaran' : 'Tambah Metode Pembayaran'}</h3>
                                <form onSubmit={savePayment} className="space-y-3.5">
                                    <div>
                                        <label className="text-xs font-bold text-zinc-600 block mb-1">Nama Metode</label>
                                        <input type="text" required placeholder="Cth: Transfer BCA" value={paymentForm.name} onChange={(e) => setPaymentForm({...paymentForm, name: e.target.value})} className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-bold" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs font-bold text-zinc-600 block mb-1">Tipe</label>
                                            <select value={paymentForm.type} onChange={(e) => setPaymentForm({...paymentForm, type: e.target.value})} className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-bold bg-white">
                                                <option value="cash">Tunai</option>
                                                <option value="qris">QRIS</option>
                                                <option value="transfer">Transfer Bank</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-zinc-600 block mb-1">Status</label>
                                            <select value={paymentForm.isActive} onChange={(e) => setPaymentForm({...paymentForm, isActive: e.target.value === 'true'})} className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-bold bg-white">
                                                <option value="true">Aktif</option>
                                                <option value="false">Nonaktif</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-zinc-600 block mb-1">Instruksi Pembayaran</label>
                                        <textarea rows="2" placeholder="Cth: Transfer ke Rek BCA 1234567890..." value={paymentForm.instructions} onChange={(e) => setPaymentForm({...paymentForm, instructions: e.target.value})} className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs"></textarea>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 bg-brand-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md hover:bg-brand-700">Simpan</button>
                                        <button type="button" onClick={() => setShowPaymentModal(false)} className="flex-1 bg-zinc-200 text-zinc-800 font-bold py-2.5 rounded-xl text-xs hover:bg-zinc-300">Batal</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showCategoryModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 glass-panel">
                            <div className="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl">
                                <h3 className="text-base font-black text-zinc-800 mb-3">Tambah Kategori Baru</h3>
                                <form onSubmit={addCategory} className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-zinc-600 block mb-1">Nama Kategori</label>
                                        <input type="text" required placeholder="Cth: Paket Hemat" value={categoryForm.name} onChange={(e) => setCategoryForm({name: e.target.value})} className="w-full p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-bold" />
                                    </div>
                                    <div className="flex gap-2 pt-1">
                                        <button type="submit" className="flex-1 bg-brand-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md hover:bg-brand-700">Tambah</button>
                                        <button type="button" onClick={() => setShowCategoryModal(false)} className="flex-1 bg-zinc-200 text-zinc-800 font-bold py-2.5 rounded-xl text-xs hover:bg-zinc-300">Batal</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
